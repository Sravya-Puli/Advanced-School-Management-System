<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teachers Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6f5;
      --surface: #ffffff;
      --border: #e5e9e7;
      --text-primary: #1a1f1c;
      --text-secondary: #6b7570;
      --accent: #1aad87;
      --accent-hover: #159e7a;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-welcome {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn svg { width: 18px; height: 18px; color: var(--text-secondary); }
    .notif-badge {
      position: absolute; top: -3px; right: -3px;
      background: #e53e3e; color: #fff;
      font-size: 9px; font-weight: 700;
      border-radius: 50%; width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--surface);
    }

    /* ── MAIN ── */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 28px;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      animation: fadeUp 0.4s ease both;
    }
    .page-title h1 {
      font-size: 26px; font-weight: 700;
      letter-spacing: -0.5px; line-height: 1.2;
    }
    .page-title p {
      font-size: 13.5px; color: var(--text-secondary); margin-top: 3px;
    }
    .btn-add {
      display: flex; align-items: center; gap: 7px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-size: 14px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 8px rgba(26,173,135,0.25);
      letter-spacing: -0.1px;
    }
    .btn-add:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 14px rgba(26,173,135,0.35);
      transform: translateY(-1px);
    }
    .btn-add:active { transform: translateY(0); }
    .btn-add svg { width: 16px; height: 16px; }

    /* ── GRID ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* ── TEACHER CARD ── */
    .teacher-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 22px 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
      animation: fadeUp 0.45s ease both;
    }
    .teacher-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.09);
      transform: translateY(-2px);
    }

    .teacher-card:nth-child(1) { animation-delay: 0.10s; }
    .teacher-card:nth-child(2) { animation-delay: 0.15s; }
    .teacher-card:nth-child(3) { animation-delay: 0.20s; }
    .teacher-card:nth-child(4) { animation-delay: 0.25s; }

    /* Avatar + Name row */
    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #b2f0e0 0%, #7dd9c5 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
      color: #1aad87;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }
    .teacher-name {
      font-size: 15px; font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      line-height: 1.3;
    }
    .teacher-subject {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Info rows */
    .card-info { display: flex; flex-direction: column; gap: 9px; }
    .info-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .info-row .icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
    .info-row span { font-family: 'DM Mono', monospace; font-size: 12.5px; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 580px) {
      .cards-grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px; }
      .page-header { flex-direction: column; gap: 14px; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <span class="topbar-welcome">Welcome back, Admin</span>
    <div class="topbar-actions">
      <button class="icon-btn" aria-label="Notifications">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="notif-badge">3</span>
      </button>
      <button class="icon-btn" aria-label="Logout">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div class="page-title">
        <h1>Teachers</h1>
        <p>Manage teaching staff</p>
      </div>
      <button class="btn-add">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Add Teacher
      </button>
    </div>

    <!-- CARDS GRID -->
    <div class="cards-grid" id="teachersGrid">
      <!-- Data will be loaded here -->
    </div>
  </main>

  <script>
    function loadTeachers() {
      fetch("/get_all_teachers")
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById("teachersGrid");
        grid.innerHTML = "";

        data.forEach((teacher, index) => {
          const initials = teacher.name.split(' ').map(n => n[0]).join('');
          grid.innerHTML += `
            <div class="teacher-card" style="animation-delay: ${0.1 + (index * 0.05)}s">
              <div class="card-header">
                <div class="avatar">${initials}</div>
                <div>
                  <div class="teacher-name">${teacher.name}</div>
                  <div class="teacher-subject">${teacher.subject}</div>
                </div>
              </div>
              <div class="card-info">
                <div class="info-row"><span class="icon">🌐</span><span>${teacher.email}</span></div>
                <div class="info-row"><span class="icon">📞</span><span>987654330${index}</span></div>
                <div class="info-row"><span class="icon">📅</span><span>Joined ${6 + index}/15/202${2 + (index % 3)}</span></div>
                <div class="info-row"><span class="icon">📚</span><span>${teacher.classes.length} classes assigned</span></div>
              </div>
            </div>
          `;
        });
      });
    }

    // Initial load
    loadTeachers();
  </script>
</body>
</html>
