<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fee Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; background: #fff; border-bottom: 1px solid #e5e5e5; }
    .topbar-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .topbar-icons { display: flex; align-items: center; gap: 18px; }
    .notif-btn { position: relative; background: none; border: none; cursor: pointer; padding: 4px; color: #555; font-size: 20px; line-height: 1; }
    .notif-badge { position: absolute; top: -2px; right: -2px; background: #e24b4a; color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .logout-btn { background: none; border: none; cursor: pointer; color: #555; font-size: 20px; line-height: 1; padding: 4px; }
    .logout-btn:hover, .notif-btn:hover { color: #1a1a1a; }

    .main { padding: 32px 28px; max-width: 1200px; margin: 0 auto; }

    .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
    .page-title { font-size: 24px; font-weight: 700; color: #1a1a1a; line-height: 1.2; }
    .page-sub { font-size: 13px; color: #777; margin-top: 4px; }
    .actions { display: flex; gap: 10px; }

    .btn-export { background: #fff; border: 1px solid #d0d0d0; border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 500; cursor: pointer; color: #1a1a1a; display: flex; align-items: center; gap: 7px; }
    .btn-export:hover { background: #f5f5f5; }
    .btn-record { background: #0f6e56; border: none; border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 7px; }
    .btn-record:hover { background: #085041; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 28px; }

    .stat-card { border-radius: 12px; border: 1px solid transparent; padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; }
    .stat-card.collected { background: #e1f5ee; border-color: #9fe1cb; }
    .stat-card.pending   { background: #faeeda; border-color: #fac775; }
    .stat-card.paid      { background: #fff;    border-color: #e5e5e5; }

    .stat-label { font-size: 13px; margin-bottom: 6px; }
    .stat-card.collected .stat-label { color: #085041; }
    .stat-card.pending   .stat-label { color: #633806; }
    .stat-card.paid      .stat-label { color: #555; }

    .stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-card.collected .stat-value { color: #0f6e56; }
    .stat-card.pending   .stat-value { color: #854f0b; }
    .stat-card.paid      .stat-value { color: #1a1a1a; }

    .stat-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .stat-card.collected .stat-icon { background: rgba(29,158,117,0.15); color: #0f6e56; }
    .stat-card.pending   .stat-icon { background: rgba(186,117,23,0.15); color: #854f0b; }
    .stat-card.paid      .stat-icon { background: #e1f5ee; color: #0f6e56; }

    .table-section { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; overflow: hidden; }
    .table-header { padding: 18px 22px; border-bottom: 1px solid #e5e5e5; font-size: 15px; font-weight: 600; color: #1a1a1a; }

    table { width: 100%; border-collapse: collapse; }
    th { padding: 11px 22px; text-align: left; font-size: 12px; font-weight: 600; color: #888; border-bottom: 1px solid #e5e5e5; background: #fafafa; text-transform: uppercase; letter-spacing: 0.03em; }
    td { padding: 16px 22px; font-size: 13px; color: #1a1a1a; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f9f9f9; }

    .receipt-id { color: #888; font-size: 12px; font-family: monospace; }
    .student-name { font-weight: 600; }
    .amount { font-weight: 600; }

    .badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; border: 1px solid #e0e0e0; color: #444; background: #f5f5f5; }

    .dl-btn { background: none; border: 1px solid #e0e0e0; cursor: pointer; color: #555; font-size: 15px; padding: 6px 10px; border-radius: 8px; transition: all 0.15s; }
    .dl-btn:hover { background: #f0f0f0; color: #1a1a1a; border-color: #ccc; }

    @media (max-width: 700px) {
      .stats { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; gap: 14px; }
      .actions { width: 100%; }
      .main { padding: 20px 14px; }
      th, td { padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="topbar-title">Welcome back, Admin</span>
    <div class="topbar-icons">
      <button class="notif-btn" title="Notifications">
        🔔
        <span class="notif-badge">3</span>
      </button>
      <button class="logout-btn" title="Logout">&#x2925;</button>
    </div>
  </div>

  <div class="main">

    <div class="page-header">
      <div>
        <div class="page-title">Fee Management</div>
        <div class="page-sub">Track payments and generate receipts</div>
      </div>
      <div class="actions">
        <button class="btn-export" onclick="location.reload()">
          🔄 Refresh
        </button>
        <button class="btn-record" onclick="openPaymentModal()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2.2">
            <path d="M8 3v10M3 8h10"/>
          </svg>
          Record Payment
        </button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card collected">
        <div>
          <div class="stat-label">Total Students</div>
          <div class="stat-value" id="totalStudents">0</div>
        </div>
        <div class="stat-icon">👥</div>
      </div>
      <div class="stat-card pending">
        <div>
          <div class="stat-label">Pending Payments</div>
          <div class="stat-value" id="pendingPayments">0</div>
        </div>
        <div class="stat-icon">⚠️</div>
      </div>
      <div class="stat-card paid">
        <div>
          <div class="stat-label">Fully Paid</div>
          <div class="stat-value" id="fullyPaid">0/0</div>
        </div>
        <div class="stat-icon">✅</div>
      </div>
    </div>

    <div class="table-section">
      <div class="table-header">Student Fee Status</div>
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Class</th>
            <th>Roll No</th>
            <th>Fee Status</th>
            <th>Pending Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="feeTableBody">
          <!-- Data will be loaded here -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- PAYMENT MODAL -->
  <div id="paymentModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:#fff; padding:32px; border-radius:16px; width:400px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">
      <h3 style="margin-bottom:20px;">Record Payment</h3>
      <div style="margin-bottom:15px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Select Student</label>
        <select id="studentSelect" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; outline:none;"></select>
      </div>
      <div style="margin-bottom:15px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Amount Paid (₹)</label>
        <input type="number" id="payAmount" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; outline:none;" placeholder="Enter amount">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">Payment Mode</label>
        <select id="payMode" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; outline:none;">
          <option value="UPI">UPI</option>
          <option value="Cash">Cash</option>
          <option value="Bank Transfer">Bank Transfer</option>
        </select>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button onclick="closePaymentModal()" style="padding:10px 20px; border:1px solid #ddd; background:#fff; border-radius:8px; cursor:pointer;">Cancel</button>
        <button onclick="submitPayment()" style="padding:10px 20px; background:#0f6e56; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    let allStudents = [];

    function loadFeeData() {
      fetch("/get_all_students")
      .then(res => res.json())
      .then(data => {
        allStudents = data;
        const tbody = document.getElementById("feeTableBody");
        const studentSelect = document.getElementById("studentSelect");
        
        tbody.innerHTML = "";
        studentSelect.innerHTML = "<option value=''>-- Select Student --</option>";

        let totalPendingCount = 0;
        let fullyPaidCount = 0;

        data.forEach(s => {
          const pendingVal = parseFloat(s.pending.toString().replace('₹', '').replace(',', '')) || 0;
          if (pendingVal > 0) totalPendingCount++;
          if (s.fee_status.toLowerCase() === 'paid') fullyPaidCount++;

          studentSelect.innerHTML += `<option value="${s.id}">${s.name} (${s.class}) - ${s.pending}</option>`;

          const statusClass = s.fee_status.toLowerCase() === 'paid' ? 'background:#ecfdf5; color:#059669;' : 
                             s.fee_status.toLowerCase() === 'partial' ? 'background:#fffbeb; color:#d97706;' : 'background:#fef2f2; color:#dc2626;';

          tbody.innerHTML += `
            <tr>
              <td class="student-name">${s.name}</td>
              <td>${s.class}</td>
              <td>${s.roll_no || '-'}</td>
              <td><span class="badge" style="${statusClass}">${s.fee_status}</span></td>
              <td class="amount">${s.pending}</td>
              <td><button class="dl-btn" onclick="openPaymentForStudent(${s.id})" title="Record Payment">₹</button></td>
            </tr>
          `;
        });

        document.getElementById("totalStudents").innerText = data.length;
        document.getElementById("pendingPayments").innerText = totalPendingCount;
        document.getElementById("fullyPaid").innerText = `${fullyPaidCount}/${data.length}`;
      });
    }

    function openPaymentModal() {
      document.getElementById("paymentModal").style.display = "flex";
    }

    function openPaymentForStudent(id) {
      document.getElementById("studentSelect").value = id;
      openPaymentModal();
    }

    function closePaymentModal() {
      document.getElementById("paymentModal").style.display = "none";
    }

    function submitPayment() {
      const studentId = document.getElementById("studentSelect").value;
      const amount = document.getElementById("payAmount").value;
      const mode = document.getElementById("payMode").value;

      if (!studentId || !amount) return alert("Please fill all fields!");

      fetch("/record_payment", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ student_id: studentId, amount_paid: amount, payment_mode: mode })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("Payment recorded successfully! ✅");
          closePaymentModal();
          loadFeeData();
        } else {
          alert("Error: " + data.message);
        }
      });
    }

    // Initial Load
    loadFeeData();
  </script>

</body>
</html>
